<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Count Up</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0e12;
      --panel: rgba(25, 28, 35, 0.86);
      --panel-strong: #1e222b;
      --text: #f6f3eb;
      --muted: #9da3b0;
      --accent: #ffb85c;
      --accent-strong: #ff9f2f;
      --accent-soft: rgba(255, 184, 92, 0.14);
      --line: rgba(255, 255, 255, 0.09);
      --danger: #ff6b6b;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 14% 16%, rgba(255, 159, 47, 0.14), transparent 30rem),
        radial-gradient(circle at 88% 84%, rgba(92, 116, 255, 0.12), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    .app {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      letter-spacing: -0.045em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(157, 163, 176, 0.1);
    }

    .status.running { color: var(--accent); }
    .status.running .status-dot { animation: pulse 1.5s ease-out infinite; }
    .status.armed { color: var(--accent); }
    .status.done { color: var(--danger); }

    .timer-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 430px);
      aspect-ratio: 1;
      margin: 0 auto 34px;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 7;
    }

    .ring-track { stroke: rgba(255,255,255,.07); }
    .ring-progress {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 9px rgba(255, 184, 92, .45));
    }

    .time {
      position: relative;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 14vw, 6.1rem);
      font-weight: 750;
      letter-spacing: -0.065em;
      line-height: 1;
    }

    .time-label {
      position: absolute;
      top: calc(50% + clamp(40px, 9vw, 65px));
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      color: var(--text);
      background: var(--panel-strong);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-2px); background: #292e39; }
    button:active:not(:disabled) { transform: translateY(0); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(255, 184, 92, .38); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .42; }

    .primary {
      color: #20160a;
      background: var(--accent);
      box-shadow: 0 10px 30px rgba(255, 159, 47, .2);
    }
    .primary:hover:not(:disabled) { background: #ffc675; }

    .setup {
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .setup-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 14px;
    }

    h2 { margin: 0; font-size: .92rem; letter-spacing: -.01em; }
    .hint { color: var(--muted); font-size: .75rem; }

    label {
      display: block;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .voice-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: rgba(255,255,255,.025);
      font-size: .86rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }

    .voice-copy {
      display: grid;
      gap: 3px;
    }

    .voice-copy small {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 500;
    }

    .voice-option input {
      width: 22px;
      height: 22px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }

    .voice-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.025);
      transition: opacity .2s ease;
    }

    .voice-settings.muted { opacity: .45; }

    .voice-setting select {
      width: 100%;
      margin-top: 7px;
      padding: 11px 36px 11px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: var(--panel-strong);
      font: inherit;
      font-size: .82rem;
      cursor: pointer;
    }

    .volume-setting {
      grid-column: 1 / -1;
    }

    .volume-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .volume-heading output {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .volume-setting input {
      width: 100%;
      height: 6px;
      margin: 13px 0 3px;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }

    .voice-preview {
      grid-column: 1 / -1;
      padding: 10px 14px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      font-size: .78rem;
    }

    .shortcut {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: #c8ccd4;
      background: rgba(255,255,255,.05);
      font: inherit;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 184, 92, .5); }
      75%, 100% { box-shadow: 0 0 0 7px rgba(255, 184, 92, 0); }
    }

    @media (max-width: 520px) {
      .app { padding: 24px 18px; border-radius: 24px; }
      header { margin-bottom: 26px; }
      .timer-wrap { margin-bottom: 24px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .primary { grid-column: auto; grid-row: auto; }
      .voice-settings { grid-template-columns: 1fr; }
      .volume-setting, .voice-preview { grid-column: 1; }
      .shortcut { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">One number at a time</p>
        <h1>Count Up</h1>
      </div>
      <div class="status" id="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <section class="timer-wrap" aria-label="Count-up timer">
      <svg class="progress-ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring-track" cx="120" cy="120" r="110"></circle>
        <circle class="ring-progress" id="ring" cx="120" cy="120" r="110"></circle>
      </svg>
      <div class="time" id="display" role="timer" aria-live="off">00:00</div>
      <div class="time-label">Hours · Minutes · Seconds</div>
    </section>

    <div class="controls">
      <button type="button" id="resetButton">Reset</button>
      <button type="button" class="primary" id="startButton">Start counting</button>
    </div>

    <section class="setup" aria-labelledby="setupTitle">
      <div class="setup-heading">
        <h2 id="setupTitle">Voice settings</h2>
        <span class="hint">Counts continuously</span>
      </div>
      <label class="voice-option">
        <span class="voice-copy">
          Spoken count
          <small>Announce every number as the counter runs</small>
        </span>
        <input id="voiceToggle" type="checkbox" checked aria-label="Enable spoken count">
      </label>
      <div class="voice-settings" id="voiceSettings">
        <label class="voice-setting">Voice style
          <select id="voiceStyle">
            <option value="auto">Automatic</option>
            <option value="woman">Woman</option>
            <option value="man">Man</option>
          </select>
        </label>
        <label class="voice-setting">Accent
          <select id="voiceAccent">
            <option value="auto">Automatic</option>
            <option value="en-US">American English</option>
            <option value="en-GB">British English</option>
            <option value="en-AU">Australian English</option>
            <option value="en-IN">Indian English</option>
            <option value="en-CA">Canadian English</option>
          </select>
        </label>
        <label class="volume-setting">
          <span class="volume-heading">Volume <output id="volumeOutput" for="voiceVolume">100%</output></span>
          <input id="voiceVolume" type="range" min="0" max="100" value="100" step="5" aria-label="Voice volume">
        </label>
        <button type="button" class="voice-preview" id="previewVoice">Preview selected voice</button>
      </div>
    </section>

    <p class="shortcut"><kbd>S</kbd> twice to start &nbsp;·&nbsp; <kbd>W</kbd> stop + reset &nbsp;·&nbsp; <kbd>A</kbd> stop &nbsp;·&nbsp; <kbd>R</kbd> reset</p>
  </main>

  <script>
    const display = document.querySelector('#display');
    const ring = document.querySelector('#ring');
    const status = document.querySelector('#status');
    const statusText = document.querySelector('#statusText');
    const startButton = document.querySelector('#startButton');
    const resetButton = document.querySelector('#resetButton');
    const voiceToggle = document.querySelector('#voiceToggle');
    const voiceSettings = document.querySelector('#voiceSettings');
    const voiceStyle = document.querySelector('#voiceStyle');
    const voiceAccent = document.querySelector('#voiceAccent');
    const voiceVolume = document.querySelector('#voiceVolume');
    const volumeOutput = document.querySelector('#volumeOutput');
    const previewVoice = document.querySelector('#previewVoice');

    const radius = 110;
    const circumference = 2 * Math.PI * radius;
    ring.style.strokeDasharray = `${circumference} ${circumference}`;

    let countMs = 0;
    let elapsedMs = 0;
    let startedAt = 0;
    let frameId = null;
    let state = 'ready';
    let sArmed = false;
    let lastSpokenSecond = null;
    let availableVoices = [];

    const womanVoiceHints = [
      'female', 'woman', 'aria', 'ava', 'emma', 'hazel', 'jenny', 'joanna',
      'karen', 'kendra', 'kimberly', 'moira', 'olivia', 'salli', 'samantha',
      'susan', 'tessa', 'veena', 'victoria', 'zira'
    ];
    const manVoiceHints = [
      'male', 'man', 'alex', 'brian', 'daniel', 'david', 'fred', 'george',
      'guy', 'james', 'joey', 'justin', 'mark', 'matthew', 'ryan', 'tom'
    ];

    function formatTime(milliseconds) {
      const total = Math.max(0, Math.ceil(milliseconds / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h > 0
        ? `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
        : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function render() {
      display.textContent = formatTime(countMs);
      const minuteProgress = (countMs % 60_000) / 60_000;
      ring.style.strokeDashoffset = circumference * (1 - minuteProgress);
      document.title = `${formatTime(countMs)} · Count Up`;

      status.className = `status ${sArmed ? 'armed' : state === 'running' ? 'running' : ''}`;
      statusText.textContent = sArmed
        ? 'Press S again'
        : { ready: 'Ready', running: 'Counting', paused: 'Paused' }[state];
      startButton.textContent = state === 'running' ? 'Pause' : state === 'paused' ? 'Resume' : 'Start counting';
    }

    function tick() {
      elapsedMs = Math.max(0, performance.now() - startedAt);
      const currentSecond = Math.floor(elapsedMs / 1000) + 1;
      countMs = currentSecond * 1000;
      render();
      speakCount(currentSecond);
      frameId = requestAnimationFrame(tick);
    }

    function start() {
      if (state === 'ready') {
        countMs = 0;
        elapsedMs = 0;
      }
      sArmed = false;
      state = 'running';
      startedAt = performance.now() - elapsedMs;
      lastSpokenSecond = null;
      cancelAnimationFrame(frameId);
      tick();
    }

    function pause() {
      elapsedMs = Math.max(0, performance.now() - startedAt);
      cancelAnimationFrame(frameId);
      frameId = null;
      sArmed = false;
      state = 'paused';
      stopSpeaking();
      render();
    }

    function toggle() {
      state === 'running' ? pause() : start();
    }

    function armWithS() {
      if (state === 'running') return;
      if (!sArmed) {
        sArmed = true;
        render();
        return;
      }
      start();
    }

    function stopTimer() {
      if (state === 'running') {
        pause();
        statusText.textContent = 'Stopped';
      } else if (sArmed) {
        sArmed = false;
        render();
      }
    }

    function reset() {
      cancelAnimationFrame(frameId);
      frameId = null;
      countMs = 0;
      elapsedMs = 0;
      state = 'ready';
      sArmed = false;
      lastSpokenSecond = null;
      stopSpeaking();
      render();
    }

    function speakCount(secondsLeft) {
      if (secondsLeft === lastSpokenSecond) return;
      lastSpokenSecond = secondsLeft;
      speak(String(secondsLeft));
    }

    function speak(message) {
      if (!voiceToggle.checked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      const selectedVoice = selectVoice();
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
      } else if (voiceAccent.value !== 'auto') {
        utterance.lang = voiceAccent.value;
      }
      utterance.rate = 1.15;
      utterance.pitch = 1;
      utterance.volume = Number(voiceVolume.value) / 100;
      window.speechSynthesis.speak(utterance);
    }

    function selectVoice() {
      if (!availableVoices.length) availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices.length) return null;

      const englishVoices = availableVoices.filter(voice => /^en([_-]|$)/i.test(voice.lang));
      const accentVoices = voiceAccent.value === 'auto'
        ? englishVoices
        : englishVoices.filter(voice => voice.lang.toLowerCase().replace('_', '-').startsWith(voiceAccent.value.toLowerCase()));
      const candidates = accentVoices.length ? accentVoices : (englishVoices.length ? englishVoices : availableVoices);

      if (voiceStyle.value !== 'auto') {
        const hints = voiceStyle.value === 'woman' ? womanVoiceHints : manVoiceHints;
        const preferred = candidates.find(voice => hints.some(hint => voice.name.toLowerCase().includes(hint)));
        if (preferred) return preferred;
      }

      return candidates.find(voice => voice.default) || candidates[0];
    }

    function loadVoices() {
      if ('speechSynthesis' in window) availableVoices = window.speechSynthesis.getVoices();
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    startButton.addEventListener('click', toggle);
    resetButton.addEventListener('click', reset);
    voiceToggle.addEventListener('change', () => {
      stopSpeaking();
      lastSpokenSecond = null;
      updateVoiceControls();
      if (voiceToggle.checked && state === 'running') {
        speakCount(Math.round(countMs / 1000));
      }
    });
    voiceVolume.addEventListener('input', () => {
      volumeOutput.value = `${voiceVolume.value}%`;
    });
    [voiceStyle, voiceAccent].forEach(control => {
      control.addEventListener('change', () => {
        stopSpeaking();
        lastSpokenSecond = null;
        if (state === 'running') speakCount(Math.round(countMs / 1000));
      });
    });
    previewVoice.addEventListener('click', () => speak('One, two, three'));

    function updateVoiceControls() {
      const disabled = !voiceToggle.checked;
      voiceSettings.classList.toggle('muted', disabled);
      voiceSettings.querySelectorAll('select, input, button').forEach(control => {
        control.disabled = disabled;
      });
    }

    document.addEventListener('keydown', event => {
      if (event.target.matches('input, select, button')) return;
      if (event.repeat) return;
      if (event.code === 'Space') {
        event.preventDefault();
        toggle();
        return;
      }

      const key = event.key.toLowerCase();
      if (key === 's') {
        event.preventDefault();
        armWithS();
      } else if (key === 'w') {
        event.preventDefault();
        reset();
      } else if (key === 'a') {
        event.preventDefault();
        stopTimer();
      } else if (key === 'r') {
        reset();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state === 'running') {
        cancelAnimationFrame(frameId);
        tick();
      }
    });

    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }
    updateVoiceControls();
    render();
  </script>
</body>
</html>
